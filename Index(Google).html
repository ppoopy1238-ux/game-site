<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Sublevel</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #050a12; }
    #sublevel-app { display: block; width: 100%; height: 100%; border: 0; background: #050a12; }
    #sublevel-loading { position: fixed; inset: 0; display: grid; place-items: center; color: #e4edf7; background: #050a12; font: 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="sublevel-loading">Loading Sublevel…</div>
  <iframe
    id="sublevel-app"
    title="Sublevel"
    src="https://ppoopy1238-ux.github.io/game-site/?source=google-apps-script&amp;v=20261117-2"
    allow="fullscreen; autoplay; clipboard-read; clipboard-write"
    allowfullscreen
    onload="document.getElementById('sublevel-loading').style.display='none'">
  </iframe>
</body>
</html>
