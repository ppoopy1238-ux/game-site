<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>Sublevel</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090b12; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #090b12; }
    #fallback {
      position: fixed; z-index: 2; left: 50%; bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%); padding: 9px 14px; border-radius: 999px;
      color: #dce4ff; background: rgba(15, 20, 36, .92); border: 1px solid #343d5b;
      font: 13px system-ui, sans-serif; text-decoration: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <!-- The actual app stays on GitHub Pages, preserving its normal origin and
       avoiding Apps Script's isolated JavaScript execution contexts. -->
  <iframe
    id="app"
    title="Sublevel application"
    src="https://ppoopy1238-ux.github.io/game-site/"
    allow="clipboard-read; clipboard-write; fullscreen"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
  <a id="fallback" href="https://ppoopy1238-ux.github.io/game-site/" target="_blank" rel="noopener">
    Open Sublevel directly
  </a>
</body>
</html>
